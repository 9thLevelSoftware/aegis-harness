name: Publish

# Publishes to npm when a vX.Y.Z tag is pushed, through npm trusted publishing (OIDC): no token is
# stored anywhere and npm attaches provenance. npm lets a package trust a workflow only once the
# package exists, so 0.1.0 was published by hand; see CONTRIBUTING.md, "Releasing".

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore a cache into a release build
      - name: npm 11.5.1 or later (trusted publishing needs it; Node 22 ships npm 10)
        run: npm install -g "npm@^11.5.1"
      - name: The tag names the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - name: Skip a version that is already on npm
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
