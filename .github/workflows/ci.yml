name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    # Gate of record. A red Linux job blocks a merge.
    name: Linux (gate of record)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:ci   # npm test, plus an annotation per failing test
      - run: npm run check:hygiene
      - name: Fixture corpus end to end, with the per-call latency budget (150 ms)
        run: npm run test:hooks
      - name: Installed package smoke test
        run: |
          npm pack --silent > pack.txt
          tar tzf "$(cat pack.txt)" | grep -q '^package/dist/guard.mjs$'
          mkdir -p /tmp/ah-install && cd /tmp/ah-install
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE/$(cat $GITHUB_WORKSPACE/pack.txt)"
          npx ah version
          npx ah test-hooks --in-process
      - name: ah init and ah doctor from the installed package, in a scratch project
        run: |
          AH=/tmp/ah-install/node_modules/.bin/ah
          mkdir -p /tmp/ah-proj && cd /tmp/ah-proj && git init -q
          printf '# Scratch\n' > AGENTS.md
          $AH init
          $AH init | tee second.txt
          if grep -E ' (added|updated|created|appended|prepended|replaced) ' second.txt; then echo "second ah init changed something"; exit 1; fi
          $AH doctor --agents claude
          $AH doctor --agents codex --json > codex.json || true
          node "$GITHUB_WORKSPACE/scripts/ci-doctor-codex.mjs" codex.json
          $AH init --remove
          test "$(cat AGENTS.md)" = "# Scratch"
          test ! -e .claude/settings.local.json && test ! -e .codex/hooks.json

  windows:
    # Devil develops on Windows 11 (WSL2 is fine for v0). The guard must still
    # parse PowerShell and cmd commands and start fast on a Windows runner.
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      AH_LATENCY_BUDGET_MS: "400"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:ci   # npm test, plus an annotation per failing test
      - run: npm run check:hygiene
      - name: Fixture corpus end to end, with the slower-runner latency budget (AH_LATENCY_BUDGET_MS)
        run: npm run test:hooks
      - name: ah init and ah doctor with node and the guard under paths with spaces
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ah with space"
          New-Item -ItemType Directory -Force (Join-Path $dir "dist") | Out-Null
          Copy-Item (Get-Command node).Source $dir
          Copy-Item dist/guard.mjs (Join-Path $dir "dist")
          # Codex: the guard under a spaced path (this volume has no 8.3 names), so
          # commandWindows quotes it; both cmd.exe and PowerShell must run it.
          $proj = Join-Path $env:RUNNER_TEMP "ah proj"
          New-Item -ItemType Directory -Force $proj | Out-Null
          git -C $proj init -q
          node dist/ah.mjs init --root $proj --guard (Join-Path $dir "dist/guard.mjs")
          if ($LASTEXITCODE) { exit 1 }
          node dist/ah.mjs doctor --root $proj --agents claude
          if ($LASTEXITCODE) { exit 1 }
          node dist/ah.mjs doctor --root $proj --agents codex --json > codex.json
          node scripts/ci-doctor-codex.mjs codex.json --both-shells --form bare/quoted --hooks (Join-Path $proj ".codex/hooks.json")
          if ($LASTEXITCODE) { exit 1 }
          # Claude Code: node.exe itself under a spaced path, run in exec form.
          $proj2 = Join-Path $env:RUNNER_TEMP "ah proj 2"
          New-Item -ItemType Directory -Force $proj2 | Out-Null
          git -C $proj2 init -q
          node dist/ah.mjs init --root $proj2 --agents claude --node (Join-Path $dir "node.exe") --guard (Join-Path $dir "dist/guard.mjs")
          if ($LASTEXITCODE) { exit 1 }
          node dist/ah.mjs doctor --root $proj2 --agents claude
          if ($LASTEXITCODE) { exit 1 }
          # Codex: node.exe under the spaced path too, so commandWindows quotes the node
          # path after its drive letter; both cmd.exe and PowerShell must run it.
          $proj3 = Join-Path $env:RUNNER_TEMP "ah proj 3"
          New-Item -ItemType Directory -Force $proj3 | Out-Null
          git -C $proj3 init -q
          node dist/ah.mjs init --root $proj3 --agents codex --node (Join-Path $dir "node.exe") --guard (Join-Path $dir "dist/guard.mjs")
          if ($LASTEXITCODE) { exit 1 }
          node dist/ah.mjs doctor --root $proj3 --agents codex --json > codex3.json
          node scripts/ci-doctor-codex.mjs codex3.json --both-shells --form quoted/quoted --hooks (Join-Path $proj3 ".codex/hooks.json")
          if ($LASTEXITCODE) { exit 1 }
