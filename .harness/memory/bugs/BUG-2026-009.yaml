incident_id: BUG-2026-009
date_recorded: 2026-10-16
status: open
title: Evaluation programs that never measured a real frontier-model run
observed_on: process (seven repositories)
source:
  - kind: repo
    repo: 9thLevelSoftware/legion-ide
    ref: 28928fe
    path: plans/evidence/production/BENCH/
    note: >-
      "raw 0/20 vs governed 4/20" is a transport artifact: the raw arm made zero tool calls, so the
      comparison measures the harness's plumbing, not its lift
  - kind: repo
    repo: 9thLevelSoftware/hermes-auto
    ref: f484621
    path: docs/research-archive/planning/codebase/index.jsonl
    note: 32 indexed evaluation paths, 17 of which no longer exist in the repository
root_cause: >-
  Evaluation scaffolding was built before there was anything to evaluate, then graded local models
  or recorded cassettes instead of the sessions the tool was for.
impact: >-
  No attempt can say whether it helped. The blueprint's "evaluator" and "ablation" planes repeat
  the pattern if built first.
countermeasure:
  kind: process
  ref: CONTRIBUTING.md#grow-by-incident
  change: >-
    No evaluator, ablation runner or benchmark until .harness/metrics.jsonl from real sessions in
    a real project shows what the guard fires on. The first measurement is deny/ask counts per rule
    per week in the dogfood repository.
must_block_fixture: ""
must_allow_fixture: ""
expiry_policy: "revisit after four weeks of dogfood metrics"
